server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: rideshare-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: rideshare
          __path__: /var/log/rideshare/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            traceId: traceId
            spanId: spanId
            requestId: requestId
            userId: userId
            userEmail: userEmail
      - labels:
          level:
          service:
      # requestId, userId, userEmail are kept as structured fields in the log body
      # (not promoted to labels — high cardinality values should not be Loki labels)
